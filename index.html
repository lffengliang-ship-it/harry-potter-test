<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta property="og:title" content="霍格沃茨学院分院测试">

  <title>霍格沃茨学院分院测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #f4d26a;
      --gold-soft: rgba(244, 210, 106, 0.18);
      --ink: #f7f0dd;
      --muted: #ddd3c0;
      --panel: rgba(18, 16, 29, 0.94);
      --panel-border: rgba(244, 210, 106, 0.24);
    }
    body {
      font-family: 'Georgia', 'Noto Serif SC', serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(116, 0, 1, 0.36), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(14, 26, 64, 0.42), transparent 32%),
        linear-gradient(135deg, #121022 0%, #201428 54%, #101927 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 78%);
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .screen {
      display: none;
      opacity: 0;
      padding: 28px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
    }
    .screen.active { display: block; animation: fadeIn 0.5s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 { font-size: 2.25rem; margin-bottom: 16px; color: var(--gold); }
    .eyebrow {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .subtitle { font-size: 1rem; color: var(--muted); margin-bottom: 28px; line-height: 1.7; }
    .letter-card {
      position: relative;
      margin: 0 auto 24px;
      padding: 28px 22px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(255, 246, 208, 0.96), rgba(211, 175, 103, 0.9)),
        #f2dca2;
      color: #2f2118;
      box-shadow: inset 0 0 0 1px rgba(90, 58, 20, 0.25), 0 22px 48px rgba(0,0,0,0.28);
      text-align: left;
    }
    .letter-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(90, 58, 20, 0.24);
      pointer-events: none;
    }
    .letter-title {
      text-align: center;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    .letter-body {
      font-size: 0.98rem;
      line-height: 1.8;
    }
    .wax-seal {
      width: 66px;
      height: 66px;
      margin: 20px auto -4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 28%, #b71d1d, #740001 70%);
      color: #f6d77b;
      font-size: 1.55rem;
      font-weight: bold;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.28), 0 8px 18px rgba(116,0,1,0.28);
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #740001;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .btn:hover { background: #9a0001; transform: translateY(-1px); }
    .btn:focus-visible,
    .option-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    .btn.secondary { background: #0e1a40; }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .houses { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
    .house-icon {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 22px rgba(0,0,0,0.24);
    }
    .gryffindor { background: #740001; color: #ffd700; }
    .hufflepuff { background: #ecb939; color: #372e29; }
    .ravenclaw { background: #0e1a40; color: #946b2d; }
    .slytherin { background: #1a472a; color: #aaaaaa; }
    .progress { color: var(--gold); font-size: 0.9rem; margin-bottom: 10px; }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      width: var(--progress);
      border-radius: inherit;
      background: linear-gradient(90deg, #740001, var(--gold));
      transition: width 0.3s ease;
    }
    .question { font-size: 1.2rem; line-height: 1.6; margin-bottom: 24px; }
    .question-scene {
      color: #f1e7cf;
      font-size: 1.05rem;
      line-height: 1.75;
      margin-bottom: 22px;
      text-align: left;
    }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 16px; background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; color: #e8e8e8;
      cursor: pointer; transition: all 0.3s ease;
      text-align: left; font-family: inherit; font-size: 1rem;
    }
    .option-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); transform: translateY(-1px); }
    .result-house {
      font-size: 1.5rem; font-weight: bold;
      margin-bottom: 16px; letter-spacing: 4px;
    }
    .character-image {
      width: 200px; height: 250px; margin: 0 auto 16px;
      border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--panel-border);
    }
    .character-image img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .character-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(244,210,106,0.18), rgba(116,0,1,0.16));
      font-size: 4rem; color: var(--gold);
    }
    .character-name { font-size: 1.8rem; color: var(--gold); margin-bottom: 4px; }
    .character-title { font-size: 0.95rem; color: var(--muted); margin-bottom: 24px; }
    .verdict-card {
      text-align: left;
      padding: 18px;
      border-radius: 12px;
      background: rgba(244,210,106,0.08);
      border: 1px solid rgba(244,210,106,0.2);
      margin: 20px 0;
    }
    .verdict-label {
      color: var(--gold);
      font-size: 0.88rem;
      margin-bottom: 8px;
    }
    .verdict-text {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #fff7df;
    }
    .spell-card {
      margin: 18px 0;
      padding: 16px;
      border-radius: 12px;
      background: rgba(14, 26, 64, 0.42);
      border: 1px solid rgba(244,210,106,0.18);
      text-align: center;
    }
    .spell-word {
      display: block;
      color: var(--gold);
      font-size: 1.45rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .spell-pronunciation,
    .spell-meaning {
      display: block;
      color: #eee1c8;
      font-size: 0.94rem;
      line-height: 1.7;
    }
    .result-details { text-align: left; margin: 24px 0; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 {
      font-size: 1rem; color: var(--gold);
      margin-bottom: 8px; border-left: 3px solid var(--gold);
      padding-left: 10px;
    }
    .traits { display: flex; flex-wrap: wrap; gap: 8px; }
    .trait-tag {
      padding: 4px 12px; background: var(--gold-soft);
      border: 1px solid rgba(244,210,106,0.36);
      border-radius: 16px; font-size: 0.85rem; color: var(--gold);
    }
    .magic-text { font-size: 0.95rem; line-height: 1.6; color: #e3ddcf; }
    .story-text {
      font-size: 0.95rem; line-height: 1.8; color: #e1dacd;
      text-indent: 2em;
    }
    .option-label {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gold-soft); color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0;
    }
    .radar-chart { margin: 20px 0; }
    .radar-chart canvas { max-width: 100%; }
    @media (max-width: 480px) {
      body { padding: 14px; align-items: flex-start; }
      .screen { padding: 22px 18px; border-radius: 12px; }
      h1 { font-size: 1.6rem; }
      .question { font-size: 1.05rem; }
      .option-btn { padding: 14px; }
      .character-image { width: 160px; height: 200px; }
      .character-name { font-size: 1.5rem; }
      .houses { gap: 8px; }
      .house-icon { width: 40px; height: 40px; font-size: 1.2rem; }
      .radar-chart { margin: 10px 0 14px; }
      .radar-chart canvas { width: 240px; height: 240px; }
      .btn { width: 100%; }
      .actions { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 首屏 -->
    <div id="start-screen" class="screen active">
      <p class="eyebrow">Hogwarts Sorting Test</p>
      <h1>霍格沃茨入学通知</h1>
      <div class="letter-card" aria-label="霍格沃茨入学通知书">
        <div class="letter-title">HOGWARTS SCHOOL OF WITCHCRAFT AND WIZARDRY</div>
        <p class="letter-body">
          亲爱的年轻巫师：<br>
          分院帽已经等候多时。请穿过九又四分之三站台，回答 8 个魔法世界里的选择。它会听见你真正的勇气、忠诚、智慧与野心，并把你送往命运所属的学院。
        </p>
        <div class="wax-seal">H</div>
      </div>
      <p class="subtitle">这不是一张普通问卷，而是一封通往霍格沃茨的邀请。</p>
      <div class="houses">
        <div class="house-icon gryffindor" title="格兰芬多">G</div>
        <div class="house-icon hufflepuff" title="赫奇帕奇">H</div>
        <div class="house-icon ravenclaw" title="拉文克劳">R</div>
        <div class="house-icon slytherin" title="斯莱特林">S</div>
      </div>
      <button class="btn" type="button" onclick="startQuiz()">开始测试</button>
    </div>

    <!-- 题目屏 -->
    <div id="quiz-screen" class="screen"></div>

    <!-- 结果屏 -->
    <div id="result-screen" class="screen"></div>
  </div>

  <script type="module">
    // 导入配置模块（后续任务会用到）
    import { HOUSE_COLORS, getCharacterImage } from './config.js';
    console.log('Config loaded successfully');

    function startQuiz() {
      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
      renderQuestion();
    }
    window.startQuiz = startQuiz;

    // 题库：8 道情境选择题

        options: [
          { text: '立刻推门进去，先确认里面的人是否安全', house: 'gryffindor' },

        ],
      },
      {
        id: 2,
        question: '魔药课上，坩埚冒出不该出现的银绿色烟雾。斯内普教授停下脚步，整个教室都安静了。你会：',

          { text: '握紧魔杖跟进去，至少不能让它独自流血', house: 'gryffindor' },

        options: [
          { text: '冲过去挡开游走球，哪怕自己会摔下扫帚', house: 'gryffindor' },

          { text: '抓住混乱瞬间改变位置，让局势转向有利', house: 'slytherin' },
        ],
      },
      {
        id: 5,
        question: '乌姆里奇贴出了新的禁令，防御术练习被彻底禁止。有人悄悄邀请你加入一个秘密训练小组。你会：',

          { text: '加入，但先确认大家都明白风险、不会互相出卖', house: 'hufflepuff' },

      },
      {

          { text: '先问清楚它会不会伤害别人，再决定是否使用', house: 'hufflepuff' },
          { text: '研究铭文、来源和限制，不弄懂绝不轻易使用', house: 'ravenclaw' },

          { text: '自己从绝境里翻盘、重新掌控局面的瞬间', house: 'slytherin' },

        },
      ],
      hufflepuff: [
        {
          id: 'newt',
          name: '纽特·斯卡曼德',

          traits: ['善良', '执着', '热爱自然', '温柔坚韧'],
          magic: '神奇动物沟通、无痕伸展咒',
          story: '纽特带着一个装满神奇动物的皮箱环游世界。他的皮箱里有一片完整的生态系统：雷鸟在云端翱翔，嗅嗅偷走所有闪亮的东西，护树罗锅帮他开锁。他被霍格沃茨开除过，但邓布利多为他辩护。当格林德沃崛起时，他本可以置身事外，却选择了站出来——不是因为野心，而是因为「那些动物需要保护，而保护它们就是正确的事」。',
        },
        {
          id: 'cedric',
          name: '塞德里克·迪戈里',
          title: '真正的勇士',
          traits: ['公平', '诚实', '勇敢', '善良'],
          magic: '变形咒、魁地奇搜捕手',
          story: '他是赫奇帕奇最出色的学生，三强争霸赛的勇士之一。在第一个项目中，他公平地告诉了哈利龙蛋的秘密；在第三个项目中，迷宫里他和哈利同时找到了火焰杯，他坚持「我们一起拿，这是公平的」。这个决定让他被传送到伏地魔复活的墓地，死在了「阿瓦达索命」之下——年仅 17 岁。哈利带着他的遗体回到霍格沃茨，整个霍格沃茨都在哭泣。',
        },
      ],
      ravenclaw: [
        {
          id: 'luna',
          name: '卢娜·洛夫古德',
          title: '疯姑娘',
          traits: ['独特思考', '智慧', '真诚', '富有想象力'],
          magic: '召唤守护灵、看到夜骐',
          story: '她从小就能看到夜骐——只有见过死亡的人才能看见。她的母亲在做实验时意外去世，父亲经营着《唱唱反调》杂志。她被同学嘲笑为"疯姑娘"，却在霍格沃茨大战中展现了非凡的勇气：她用「除你武器」击昏了食死徒，还帮助哈利找到了拉文克劳的冠冕——魂器之一。战后，她成为了著名的自然学家，发现和分类了许多新的神奇动物。',
        },
        {
          id: 'cho',
          name: '秋·张',
          title: '拉文克劳找球手',
          traits: ['优雅', '感性', '聪慧', '重情重义'],
          magic: '高级魔咒、魁地奇飞行',
          story: '她是拉文克劳魁地奇球队的找球手，也是哈利·波特的初恋。她在塞德里克死后加入了邓布利多军，学习防御术来对抗食死徒。在霍格莫德村的训练课上，她因玛丽埃塔的背叛而暴露了 D.A. 的秘密据点，从此背负着愧疚。大战中，她回到了霍格沃茨，与曾经的同学们并肩作战——这一次，她不再只是塞德里克的女朋友，而是选择了自己站队的战士。',
        },
      ],
      slytherin: [
        {
          id: 'snape',
          name: '西弗勒斯·斯内普',
          title: '最勇敢的人',
          traits: ['复杂', '牺牲', '深情', '双重身份'],
          magic: '魔药大师、大脑封闭术、黑魔法防御',
          story: '他的一生都在扮演双面间谍。表面上他是伏地魔最信任的食死徒，实际上他从莉莉·波特死后就一直在保护哈利。他冒着生命危险给邓布利多传递情报，在伏地魔身边隐藏了多年。最后，他在尖叫棚屋被纳吉尼咬死，临死前把记忆给了哈利——那些记忆揭示了他对莉莉一生的爱，以及他真正的忠诚。「看着我」——他最后的话，是想在死前再看一次和莉莉一样的绿色眼睛。',
        },
        {
          id: 'draco',
          name: '德拉克·马尔福',
          title: '被宠坏的少爷',
          traits: ['精致利己', '摇摆不定', '家族荣誉', '内心挣扎'],
          magic: '大脑封闭术、决斗咒',
          story: '他从小被灌输纯血统的优越感，却在六年级时接到了一个不可能完成的任务：杀死邓布利多。他花了整个学期修理消失柜，让食死徒潜入霍格沃茨。但在天文塔上，当邓布利多毫无防备地站在他面前时，他下不了手。他降下了邓布利多的魔杖，却没有念出杀戮咒。在霍格沃茨大战中，他和父母一起逃离了战场——他从来不是真正的恶人，只是一个被家族裹挟的少年。',
        },
      ],
    };

    const RESULT_COPY = {
      harry: {
        verdict: '你不是不害怕。你只是会在害怕的时候，仍然走向该走的地方。',
        spell: 'Expelliarmus',
        pronunciation: '埃克斯-佩利-阿穆斯',
        meaning: '除你武器：用最少的伤害，挡住最大的黑暗。',
      },
      hermione: {
        verdict: '你的勇气藏在清醒里。别人凭直觉冲向前，你会把路照亮，再带大家一起走。',
        spell: 'Protego',
        pronunciation: '普罗-泰戈',
        meaning: '盔甲护身：保护边界，也保护你在乎的人。',
      },
      ron: {
        verdict: '你不是永远自信的人，但你会在朋友需要时回来。忠诚，是你最可靠的魔法。',
        spell: 'Wingardium Leviosa',
        pronunciation: '温加迪姆-勒维奥萨',
        meaning: '漂浮咒：把沉重的时刻托起来。',
      },
      newt: {
        verdict: '你看得见别人忽略的生命，也愿意为脆弱的东西停下脚步。',
        spell: 'Revelio',
        pronunciation: '瑞维利欧',
        meaning: '显形咒：让隐藏的真相温柔地显现。',
      },
      cedric: {
        verdict: '你相信公平不是口号，而是在胜利近在眼前时，仍然愿意伸出手。',
        spell: 'Lumos',
        pronunciation: '卢莫斯',
        meaning: '荧光闪烁：在混乱里点亮体面与正直。',
      },
      luna: {
        verdict: '你有一种安静的自由。世界觉得奇怪的地方，常常正是你看见真相的入口。',
        spell: 'Expecto Patronum',
        pronunciation: '艾克斯-派克托-帕特罗努姆',
        meaning: '呼神护卫：召唤内心最不愿熄灭的光。',
      },
      cho: {
        verdict: '你敏感，却并不脆弱。你会带着伤口继续选择，也会在下一次飞行里重新找到风。',
        spell: 'Accio',
        pronunciation: '阿奇欧',
        meaning: '飞来咒：把失散的勇气重新召回身边。',
      },
      snape: {
        verdict: '你很少解释自己。可真正重要的事，你会藏在沉默里守到最后。',
        spell: 'Expecto Patronum',
        pronunciation: '艾克斯-派克托-帕特罗努姆',
        meaning: '呼神护卫：让一生的执念化成银色的守护。',
      },
      draco: {
        verdict: '你不是没有野心，只是正在学会分辨：哪些胜利值得，哪些命令不必服从。',
        spell: 'Protego',
        pronunciation: '普罗-泰戈',
        meaning: '盔甲护身：在家族、恐惧和自己之间立起边界。',
      },
    };

    // 答题状态
    let currentQuestion = 0;
    let scores = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
    let answers = [];
    let lastResult = null;

    function renderQuestion() {
      const q = QUESTIONS[currentQuestion];
      const container = document.getElementById('quiz-screen');
      const progress = Math.round((currentQuestion / QUESTIONS.length) * 100);
      container.innerHTML = `
        <div class="progress">${currentQuestion + 1} / ${QUESTIONS.length}</div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" style="--progress: ${progress}%"></div>
        </div>
        <h2 class="question question-scene">${q.question}</h2>
        <div class="options">
          ${q.options.map((opt, idx) => `
            <button class="option-btn" type="button" onclick="selectAnswer('${opt.house}', ${idx})">
              <span class="option-label">${String.fromCharCode(65 + idx)}</span>
              <span class="option-text">${opt.text}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function selectAnswer(house, optionIndex) {
      scores[house]++;
      answers.push({ question: currentQuestion, house, optionIndex });
      currentQuestion++;

      if (currentQuestion < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function getResult() {
      // 找出最高分学院（平局时按用户答题记录中第一个出现的最高分学院获胜）
      const entries = Object.entries(scores);
      entries.sort((a, b) => b[1] - a[1]);
      const maxScore = entries[0][1];

      // 找到所有最高分的学院
      const topHouses = entries.filter(e => e[1] === maxScore).map(e => e[0]);

      // 平局处理：按用户答题时第一次选择该学院的顺序优先
      let topHouse = topHouses[0];
      if (topHouses.length > 1) {
        // 遍历用户的答题记录，找到第一个属于topHouses的学院
        for (const answer of answers) {
          if (topHouses.includes(answer.house)) {
            topHouse = answer.house;
            break;
          }
        }
      }

      // 在该学院中随机选一个角色
      const houseCharacters = CHARACTERS[topHouse];
      const character = houseCharacters[Math.floor(Math.random() * houseCharacters.length)];

      return { house: topHouse, character, scores };
    }

    window.selectAnswer = selectAnswer;

    // 暴露到全局以便控制台验证
    window.CHARACTERS = CHARACTERS;

    function showResult() {
      const result = getResult();
      lastResult = result;
      const houseConfig = HOUSE_COLORS[result.house];
      const char = result.character;
      const copy = RESULT_COPY[char.id];

      const container = document.getElementById('result-screen');
      container.innerHTML = `
        <p class="eyebrow">The Sorting Hat Has Spoken</p>
        <div class="result-house" style="color: ${houseConfig.secondary}">
          分院帽的判词：${houseConfig.name}
        </div>
        <div class="result-character">
          <div class="character-image">
            <img src="${getCharacterImage(char.id)}"
                 alt="${char.name}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="character-placeholder" style="display:none">
              <span>${char.name[0]}</span>
            </div>
          </div>
          <h2 class="character-name">${char.name}</h2>
          <p class="character-title">${char.title}</p>
        </div>

        <div class="verdict-card">
          <div class="verdict-label">你的魔法命运</div>
          <p class="verdict-text">${copy.verdict}</p>
        </div>

        <div class="spell-card">
          <span class="spell-word">${copy.spell}</span>
          <span class="spell-pronunciation">读音：${copy.pronunciation}</span>
          <span class="spell-meaning">${copy.meaning}</span>
        </div>

        <div class="radar-chart" aria-label="性格倾向雷达图">
          <canvas id="radarCanvas" width="260" height="260"></canvas>
        </div>
        <div class="result-details">
          <div class="detail-section">
            <h3>分院帽看见了这些特质</h3>
            <div class="traits">
              ${char.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
            </div>
          </div>
          <div class="detail-section">
            <h3>与这个角色相连的魔法</h3>
            <p class="magic-text">${char.magic}</p>
          </div>
          <div class="detail-section story-section">
            <h3>你抽中的名场面</h3>
            <p class="story-text">${char.story}</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn secondary" type="button" onclick="shareResult()">分享结果</button>
          <button class="btn" type="button" onclick="restartQuiz()">再测一次</button>
        </div>
      `;

      document.getElementById('quiz-screen').classList.remove('active');
      document.getElementById('result-screen').classList.add('active');
      setTimeout(() => drawRadarChart(result.scores), 100);
    }

    function restartQuiz() {
      currentQuestion = 0;
      scores = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
      answers = [];
      lastResult = null;
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('start-screen').classList.add('active');
    }

    window.restartQuiz = restartQuiz;

    function shareResult() {
      const result = lastResult || getResult();
      const copy = RESULT_COPY[result.character.id];
      const text = `分院帽把我分到了${HOUSE_COLORS[result.house].name}，我最像${result.character.name}，专属咒语是 ${copy.spell}（${copy.pronunciation}）。`;
      const url = 'https://pjhp.afeng.click/';

      if (navigator.share) {
        navigator.share({ title: '霍格沃茨分院测试', text: text + ' ' + url }).catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text + ' ' + url)
          .then(() => alert('结果已复制到剪贴板！'))
          .catch(() => alert('复制失败，请手动复制'));
      } else {
        alert('您的浏览器不支持分享功能');
      }
    }
    window.shareResult = shareResult;

    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 100;

      const houses = ['gryffindor', 'hufflepuff', 'ravenclaw', 'slytherin'];
      const labels = ['勇气', '忠诚', '智慧', '野心'];
      const maxScore = Math.max(...Object.values(scores), 1);

      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制背景网格
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 4; j++) {
          const angle = (Math.PI * 2 * j) / 4 - Math.PI / 2;
          const r = (radius * i) / 4;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 绘制轴线
      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI * 2 * i) / 4 - Math.PI / 2;
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
        ctx.stroke();

        // 标签
        const labelX = centerX + (radius + 20) * Math.cos(angle);
        const labelY = centerY + (radius + 20) * Math.sin(angle);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px Georgia';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[i], labelX, labelY);
      }

      // 绘制数据
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;

      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI * 2 * i) / 4 - Math.PI / 2;
        const value = scores[houses[i]] || 0;
        const r = (value / maxScore) * radius;
        const x = centerX + r * Math.cos(angle);
        const y = centerY + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  </script>
</body>
