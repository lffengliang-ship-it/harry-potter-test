<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="8 道魔法世界情境题，测测你属于霍格沃茨哪个学院，最像哪位巫师。">
  <meta property="og:title" content="霍格沃茨学院分院测试">
  <meta property="og:description" content="穿过九又四分之三站台，看看分院帽会把你送往哪里。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pjhp.afeng.click/">
  <meta name="theme-color" content="#171326">
  <title>霍格沃茨学院分院测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #f4d26a;
      --gold-soft: rgba(244, 210, 106, 0.18);
      --ink: #f7f0dd;
      --muted: #ddd3c0;
      --panel: rgba(50, 34, 38, 0.86);
      --panel-border: rgba(219, 177, 102, 0.32);
    }
    body {
      font-family: 'Georgia', 'Noto Serif SC', serif;
      background:
        radial-gradient(circle at 22% 12%, rgba(219, 177, 102, 0.2), transparent 34%),
        radial-gradient(circle at 80% 18%, rgba(74, 26, 33, 0.28), transparent 34%),
        radial-gradient(circle at 48% 88%, rgba(58, 40, 45, 0.48), transparent 46%),
        linear-gradient(140deg, #3a2026 0%, #2e202a 48%, #211f2f 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(244,210,106,0.18) 1px, transparent 1.5px),
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 92px 92px, 48px 48px, 48px 48px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 78%);
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .screen {
      display: none;
      opacity: 0;
      padding: 28px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }
    .screen.active { display: block; animation: fadeIn 0.5s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 { font-size: 2.25rem; margin-bottom: 16px; color: var(--gold); }
    .eyebrow {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 1.04rem;
      color: #f8e5bd;
      margin-bottom: 28px;
      line-height: 1.7;
      text-shadow: 0 1px 18px rgba(244,210,106,0.16);
    }
    .letter-card {
      position: relative;
      margin: 0 auto 24px;
      padding: 30px 24px;
      border-radius: 16px;
      background:
        linear-gradient(rgba(76, 48, 23, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.22), transparent 38%),
        linear-gradient(145deg, #f3ddb0, #dfbd78);
      background-size: 100% 28px, auto, auto;
      color: #2b2117;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.36), 0 26px 56px rgba(0,0,0,0.3);
      text-align: left;
      overflow: hidden;
    }
    .letter-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(82, 56, 26, 0.26);
      border-radius: 12px;
      pointer-events: none;
    }
    .letter-sparkle {
      position: absolute;
      color: rgba(35, 91, 64, 0.36);
      font-size: 1.1rem;
      line-height: 1;
      pointer-events: none;
    }
    .letter-sparkle.one { top: 24px; left: 24px; }
    .letter-sparkle.two { top: 96px; right: 28px; color: rgba(116, 0, 1, 0.28); }
    .letter-sparkle.three { bottom: 30px; left: 36px; color: rgba(82, 56, 26, 0.34); }
    .letter-title {
      text-align: center;
      color: #244b36;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.18em;
      margin-bottom: 26px;
      line-height: 1.35;
    }
    .letter-body {
      font-size: 0.98rem;
      line-height: 1.8;
      color: #263c2f;
    }
    .wax-seal {
      width: auto;
      height: auto;
      margin: 22px auto -2px;
      display: block;
      text-align: center;
      background: transparent;
      color: #6d3f15;
      border: 0;
      font-size: 0.76rem;
      letter-spacing: 0.2em;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: none;
    }
    .wax-seal::before,
    .wax-seal::after {
      content: "";
      display: inline-block;
      width: 38px;
      height: 1px;
      margin: 0 10px 4px;
      background: rgba(36, 75, 54, 0.34);
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(135deg, #b83338, #7b1019);
      color: #fff7ef;
      border: 1px solid rgba(244, 210, 106, 0.48);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 12px 30px rgba(123, 16, 25, 0.24);
    }
    .btn:hover {
      background: linear-gradient(135deg, #c94448, #8d1720);
      border-color: rgba(244, 210, 106, 0.68);
      transform: translateY(-1px);
    }
    .btn:focus-visible,
    .option-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    .btn.secondary {
      background: #0e1a40;
      color: #fff;
      border-color: rgba(255,255,255,0.14);
      box-shadow: none;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .houses { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
    .house-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 22px rgba(0,0,0,0.24);
    }
    .gryffindor { background: #740001; color: #ffd700; }
    .hufflepuff { background: #ecb939; color: #372e29; }
    .ravenclaw { background: #0e1a40; color: #946b2d; }
    .slytherin { background: #1a472a; color: #d6d6d6; }
    .progress { color: var(--gold); font-size: 0.9rem; margin-bottom: 10px; }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      width: var(--progress);
      border-radius: inherit;
      background: linear-gradient(90deg, #740001, var(--gold));
      transition: width 0.3s ease;
    }
    .question { font-size: 1.2rem; line-height: 1.6; margin-bottom: 24px; }
    .question-scene {
      color: #f1e7cf;
      font-size: 1.05rem;
      line-height: 1.75;
      margin-bottom: 22px;
      text-align: left;
    }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 16px; background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; color: #e8e8e8;
      cursor: pointer; transition: all 0.3s ease;
      text-align: left; font-family: inherit; font-size: 1rem;
    }
    .option-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); transform: translateY(-1px); }
    .result-house {
      font-size: 1.5rem; font-weight: bold;
      margin-bottom: 16px; letter-spacing: 4px;
    }
    .result-scene {
      margin: 18px 0 22px;
      padding: 0;
      background: transparent;
      border: 0;
    }
    .character-image {
      width: min(100%, 340px);
      aspect-ratio: 3 / 4;
      height: auto;
      margin: 0 auto 16px;
      border-radius: 10px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(244,210,106,0.12), transparent 52%),
        rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      border: 0;
      box-shadow: 0 18px 44px rgba(0,0,0,0.24);
    }
    .character-image img {
      width: 100%; height: 100%; object-fit: cover;
      object-position: center top;
    }
    .character-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(244,210,106,0.18), rgba(116,0,1,0.16));
      font-size: 4rem; color: var(--gold);
    }
    .character-name { font-size: 1.8rem; color: var(--gold); margin-bottom: 4px; }
    .character-title { font-size: 0.95rem; color: var(--muted); margin-bottom: 24px; }
    .scene-caption {
      color: #f5e8c8;
      font-size: 1rem;
      line-height: 1.75;
      text-align: center;
      max-width: 92%;
      margin: 0 auto;
    }
    .spell-card {
      margin: 24px 0 22px;
      padding: 14px 0 16px;
      border-radius: 0;
      background: transparent;
      border-top: 1px solid rgba(244,210,106,0.18);
      border-bottom: 1px solid rgba(244,210,106,0.18);
      text-align: center;
    }
    .spell-word {
      display: block;
      color: var(--gold);
      font-size: 1.45rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .spell-pronunciation,
    .spell-meaning {
      display: block;
      color: #eee1c8;
      font-size: 0.94rem;
      line-height: 1.7;
    }
    .result-details { text-align: left; margin: 18px 0 24px; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h3 {
      font-size: 1rem; color: var(--gold);
      margin-bottom: 10px;
      border-left: 0;
      padding-left: 0;
      text-align: center;
    }
    .traits { display: flex; flex-wrap: wrap; gap: 8px; }
    .trait-tag {
      padding: 4px 12px; background: var(--gold-soft);
      border: 1px solid rgba(244,210,106,0.36);
      border-radius: 16px; font-size: 0.85rem; color: var(--gold);
    }
    .magic-text { font-size: 0.95rem; line-height: 1.6; color: #e3ddcf; }
    .story-text {
      font-size: 0.95rem; line-height: 1.8; color: #e1dacd;
      text-indent: 2em;
    }
    .share-panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(8, 6, 12, 0.62);
      backdrop-filter: blur(10px);
    }
    .share-panel.active { display: flex; }
    .share-sheet {
      width: min(100%, 460px);
      padding: 20px;
      border-radius: 16px;
      background: rgba(45, 32, 40, 0.98);
      border: 1px solid rgba(219, 177, 102, 0.28);
      box-shadow: 0 24px 70px rgba(0,0,0,0.36);
      color: var(--ink);
      text-align: left;
    }
    .share-sheet h3 {
      color: var(--gold);
      font-size: 1.15rem;
      margin-bottom: 8px;
    }
    .share-sheet p {
      color: #e8d8b8;
      line-height: 1.6;
      font-size: 0.94rem;
      margin-bottom: 14px;
    }
    .share-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .share-option {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(244,210,106,0.24);
      background: rgba(255,255,255,0.055);
      color: #fff2d2;
      font-family: inherit;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }
    .share-option:hover { background: rgba(255,255,255,0.09); }
    .share-option small {
      display: block;
      margin-top: 4px;
      color: #cfc0a2;
      font-size: 0.82rem;
    }
    .share-close {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      background: transparent;
      color: #d9c7a3;
      font-family: inherit;
      cursor: pointer;
    }
    .poster-preview {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(244,210,106,0.18);
    }
    .poster-preview.active { display: block; }
    .poster-preview canvas {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(244,210,106,0.2);
      background: #1f1720;
      display: block;
    }
    .poster-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .poster-actions .share-option {
      flex: 1;
      width: auto;
      text-align: center;
      padding: 12px;
    }
    .option-label {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gold-soft); color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0;
    }
    .radar-chart { margin: 20px 0; }
    .radar-chart canvas { max-width: 100%; }
    @media (max-width: 480px) {
      body { padding: 14px; align-items: flex-start; }
      .screen { padding: 22px 18px; border-radius: 12px; }
      h1 { font-size: 1.6rem; }
      .question { font-size: 1.05rem; }
      .option-btn { padding: 14px; }
      .character-image { width: min(100%, 300px); }
      .character-name { font-size: 1.5rem; }
      .houses { gap: 8px; }
      .house-icon { width: 42px; height: 42px; font-size: 1rem; }
      .radar-chart { margin: 10px 0 14px; }
      .radar-chart canvas { width: 240px; height: 240px; }
      .btn { width: 100%; }
      .actions { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 首屏 -->
    <div id="start-screen" class="screen active">
      <p class="eyebrow">Hogwarts Sorting Test</p>
      <h1>霍格沃茨入学通知</h1>
      <div class="letter-card" aria-label="霍格沃茨入学通知书">
        <span class="letter-sparkle one">✦</span>
        <span class="letter-sparkle two">✧</span>
        <span class="letter-sparkle three">✦</span>
        <div class="letter-title">HOGWARTS SCHOOL OF WITCHCRAFT AND WIZARDRY</div>
        <p class="letter-body">
          亲爱的年轻巫师：<br>
          分院帽已经等候多时。请穿过九又四分之三站台，回答 8 个魔法世界里的选择。它会听见你真正的勇气、忠诚、智慧与野心，并把你送往命运所属的学院。
        </p>
        <div class="wax-seal">HOGWARTS</div>
      </div>
      <p class="subtitle">今晚，分院帽只问一个问题：当魔法世界真的站到你面前，你会怎样选择？</p>
      <div class="houses">
        <div class="house-icon gryffindor" title="格兰芬多">G</div>
        <div class="house-icon hufflepuff" title="赫奇帕奇">H</div>
        <div class="house-icon ravenclaw" title="拉文克劳">R</div>
        <div class="house-icon slytherin" title="斯莱特林">S</div>
      </div>
      <button class="btn" type="button" onclick="startQuiz()">开始测试</button>
    </div>

    <!-- 题目屏 -->
    <div id="quiz-screen" class="screen"></div>

    <!-- 结果屏 -->
    <div id="result-screen" class="screen"></div>
  </div>

  <div id="share-panel" class="share-panel" role="dialog" aria-modal="true" aria-labelledby="share-title">
    <div class="share-sheet">
      <h3 id="share-title">分享你的分院结果</h3>
      <p id="share-summary">选择一种方式，把分院帽的判词带给下一位巫师。</p>
      <div class="share-options">
        <button class="share-option" type="button" onclick="generatePoster()">
          生成结果海报
          <small>生成一张可保存的角色结果图</small>
        </button>
        <button class="share-option" type="button" onclick="nativeShareResult()">
          调用系统分享
          <small>适合微信、消息、社交平台</small>
        </button>
        <button class="share-option" type="button" onclick="copyShareLink()">
          复制测试链接
          <small>把链接发给朋友，让 TA 也来分院</small>
        </button>
      </div>
      <div id="poster-preview" class="poster-preview">
        <canvas id="poster-canvas" width="900" height="1350"></canvas>
        <div class="poster-actions">
          <button class="share-option" type="button" onclick="downloadPoster()">保存海报</button>
          <button class="share-option" type="button" onclick="copyShareLink()">复制链接</button>
        </div>
      </div>
      <button class="share-close" type="button" onclick="closeSharePanel()">暂时不了</button>
    </div>
  </div>

  <script type="module">
    // 导入配置模块（后续任务会用到）
    import { HOUSE_COLORS, getCharacterImage } from './config.js';
    console.log('Config loaded successfully');

    function startQuiz() {
      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
      renderQuestion();
    }
    window.startQuiz = startQuiz;

    // 题库：8 道情境选择题
    // 每题 4 个选项，分别对应学院与角色倾向
    const QUESTIONS = [
      {
        id: 1,
        question: '深夜的霍格沃茨走廊只剩下画像的低语。盥洗室方向传来压低的哭声，火把忽明忽暗。你会：',
        options: [
          { text: '立刻推门进去，先确认里面的人是否安全', house: 'gryffindor', character: 'harry' },
          { text: '回公共休息室叫上最信任的朋友一起去', house: 'hufflepuff', character: 'cedric' },
          { text: '先观察门缝、脚印和声音，判断发生了什么', house: 'ravenclaw', character: 'luna' },
          { text: '记住这个秘密地点，等更合适的时机再处理', house: 'slytherin', character: 'draco' },
        ],
      },
      {
        id: 2,
        question: '魔药课上，坩埚冒出不该出现的银绿色烟雾。斯内普教授停下脚步，整个教室都安静了。你会：',
        options: [
          { text: '站出来承认是自己下错了材料，准备接受扣分', house: 'gryffindor', character: 'harry' },
          { text: '先护住旁边同学，再低声请求重新来过', house: 'hufflepuff', character: 'newt' },
          { text: '立刻回忆火候和顺序，找出烟雾变色的原因', house: 'ravenclaw', character: 'hermione' },
          { text: '观察教授反应，判断他更在意错误还是态度', house: 'slytherin', character: 'snape' },
        ],
      },
      {
        id: 3,
        question: '海格的小屋外传来奇怪的低吼。禁林边缘有一串新鲜脚印，像是某种受伤的神奇动物留下的。你会：',
        options: [
          { text: '握紧魔杖跟进去，至少不能让它独自流血', house: 'gryffindor', character: 'harry' },
          { text: '先找海格，他一定知道怎么不伤害它', house: 'hufflepuff', character: 'newt' },
          { text: '记录脚印形状，回图书馆查它属于哪种生物', house: 'ravenclaw', character: 'luna' },
          { text: '准备好退路和照明咒，再选择是否进入禁林', house: 'slytherin', character: 'draco' },
        ],
      },
      {
        id: 4,
        question: '魁地奇球场上，游走球突然失控，直直冲向你的队友。看台上的欢呼声一下子变成尖叫。你会：',
        options: [
          { text: '冲过去挡开游走球，哪怕自己会摔下扫帚', house: 'gryffindor', character: 'ron' },
          { text: '提醒全队散开，同时飞向队友身边支援', house: 'hufflepuff', character: 'cedric' },
          { text: '判断游走球轨迹，用最小动作把它引开', house: 'ravenclaw', character: 'cho' },
          { text: '抓住混乱瞬间改变位置，让局势转向有利', house: 'slytherin', character: 'draco' },
        ],
      },
      {
        id: 5,
        question: '乌姆里奇贴出了新的禁令，防御术练习被彻底禁止。有人悄悄邀请你加入一个秘密训练小组。你会：',

    function getResult() {
      // 找出最高分学院（平局时按用户答题记录中第一个出现的最高分学院获胜）
      const entries = Object.entries(scores);
      entries.sort((a, b) => b[1] - a[1]);
      const maxScore = entries[0][1];

      // 找到所有最高分的学院
      const topHouses = entries.filter(e => e[1] === maxScore).map(e => e[0]);

      // 平局处理：按用户答题时第一次选择该学院的顺序优先
      let topHouse = topHouses[0];
      if (topHouses.length > 1) {
        // 遍历用户的答题记录，找到第一个属于topHouses的学院
        for (const answer of answers) {
          if (topHouses.includes(answer.house)) {
            topHouse = answer.house;
            break;
          }
        }
      }

      const houseCharacters = CHARACTERS[topHouse];
      const character = houseCharacters
        .slice()
        .sort((a, b) => characterScores[b.id] - characterScores[a.id])[0];

      return { house: topHouse, character, scores, characterScores };
    }

        navigator.clipboard.writeText(payload.url)
          .then(() => {
            if (status) status.textContent = '测试链接已复制，可以直接发给朋友了。';
          })
          .catch(() => alert('复制失败，请手动复制链接：https://pjhp.afeng.click/'));
      } else {
        alert('请手动复制链接：https://pjhp.afeng.click/');
      }
    }
    window.copyShareLink = copyShareLink;

    function roundRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 4) {
      const words = Array.from(text);
      const lines = [];
      let line = '';
      words.forEach((word) => {
        const testLine = line + word;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = testLine;
        }
      });
      if (line) lines.push(line);
      const visibleLines = lines.slice(0, maxLines);
      visibleLines.forEach((visibleLine, index) => {
        const output = index === maxLines - 1 && lines.length > maxLines
          ? `${visibleLine.slice(0, -1)}...`
          : visibleLine;
        ctx.fillText(output, x, y + index * lineHeight);
      });
      return y + visibleLines.length * lineHeight;
    }

    function drawPosterFrame(ctx, width, height) {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#2a1c24');
      gradient.addColorStop(0.52, '#493025');
      gradient.addColorStop(1, '#1a1723');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(244, 210, 106, 0.08)';
      ctx.beginPath();
      ctx.arc(120, 150, 260, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(760, 980, 320, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(244, 210, 106, 0.45)';
      ctx.lineWidth = 4;
      ctx.strokeRect(46, 46, width - 92, height - 92);
      ctx.strokeStyle = 'rgba(244, 210, 106, 0.22)';
      ctx.lineWidth = 1;
      ctx.strokeRect(68, 68, width - 136, height - 136);
    }

    function loadPosterImage(src) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
        image.src = src;
      });
    }

    async function generatePoster() {
      const result = lastResult || getResult();
      const copy = RESULT_COPY[result.character.id];
      const canvas = document.getElementById('poster-canvas');
      const preview = document.getElementById('poster-preview');
      const status = document.getElementById('share-summary');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      drawPosterFrame(ctx, width, height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f4d26a';
      ctx.font = '28px Georgia, serif';
      ctx.fillText('HOGWARTS SORTING RESULT', width / 2, 120);

      ctx.fillStyle = '#fff1cf';
      ctx.font = '52px Georgia, "Songti SC", serif';
      ctx.fillText(`${HOUSE_COLORS[result.house].name} · ${result.character.name}`, width / 2, 205);

      const image = await loadPosterImage(getCharacterImage(result.character.id));
      const imageX = 255;
      const imageY = 265;
      const imageW = 390;
      const imageH = 520;
      ctx.save();
      roundRectPath(ctx, imageX, imageY, imageW, imageH, 22);
      ctx.clip();
      if (image) {
        const scale = Math.max(imageW / image.width, imageH / image.height);
        const drawW = image.width * scale;
        const drawH = image.height * scale;
        ctx.drawImage(image, imageX + (imageW - drawW) / 2, imageY, drawW, drawH);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(imageX, imageY, imageW, imageH);
        ctx.fillStyle = '#f4d26a';
        ctx.font = '120px Georgia, serif';
        ctx.fillText(result.character.name[0], width / 2, imageY + 300);
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(244,210,106,0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(imageX - 10, imageY - 10, imageW + 20, imageH + 20);

      ctx.fillStyle = '#fff7df';
      ctx.font = '34px Georgia, "Songti SC", serif';
      const quoteBottom = wrapCanvasText(ctx, copy.scene, width / 2, 875, 690, 54, 3);

      ctx.fillStyle = '#f4d26a';
      ctx.font = '42px Georgia, serif';
      ctx.fillText(copy.spell, width / 2, quoteBottom + 72);
      ctx.fillStyle = '#ead7ad';
      ctx.font = '25px Georgia, "Songti SC", serif';
      ctx.fillText(copy.pronunciation, width / 2, quoteBottom + 112);
      ctx.fillStyle = '#d9c7a3';
      ctx.font = '24px Georgia, "Songti SC", serif';
      wrapCanvasText(ctx, copy.meaning, width / 2, quoteBottom + 154, 650, 38, 2);

      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(180, 1180, 560, 82);
      ctx.fillStyle = '#fff1cf';
      ctx.font = '26px Georgia, "Songti SC", serif';
      ctx.fillText('测试链接：pjhp.afeng.click', width / 2, 1230);

      preview.classList.add('active');
      if (status) status.textContent = '结果海报已生成，可以保存图片，也可以复制测试链接。';
    }
    window.generatePoster = generatePoster;

    function downloadPoster() {
      const canvas = document.getElementById('poster-canvas');
      const result = lastResult || getResult();
      const link = document.createElement('a');
      link.download = `hogwarts-${result.character.id}-result.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    window.downloadPoster = downloadPoster;

    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 100;

      const houses = ['gryffindor', 'hufflepuff', 'ravenclaw', 'slytherin'];
      const labels = ['勇气', '忠诚', '智慧', '野心'];
      const maxScore = Math.max(...Object.values(scores), 1);

      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制背景网格
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 4; j++) {
          const angle = (Math.PI * 2 * j) / 4 - Math.PI / 2;
          const r = (radius * i) / 4;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 绘制轴线
      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI * 2 * i) / 4 - Math.PI / 2;
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
        ctx.stroke();

        // 标签
        const labelX = centerX + (radius + 20) * Math.cos(angle);
        const labelY = centerY + (radius + 20) * Math.sin(angle);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px Georgia';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[i], labelX, labelY);
      }

      // 绘制数据
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;

      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI * 2 * i) / 4 - Math.PI / 2;
        const value = scores[houses[i]] || 0;
        const r = (value / maxScore) * radius;
        const x = centerX + r * Math.cos(angle);
        const y = centerY + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  </script>
